<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>LuxeFinds · Live-Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  html, body { height: 100%; margin: 0; }
  .chat-page {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }
  /* Ab Tablet-/Desktop-Breite: Chat als zentrierte Karte statt Vollbild-Streifen */
  @media (min-width: 640px) {
    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 14% 18%, rgba(124,92,252,0.16), transparent 55%),
        radial-gradient(circle at 86% 82%, rgba(244,91,181,0.14), transparent 55%),
        var(--bg);
    }
    .chat-page {
      width: 100%;
      max-width: 460px;
      height: min(84vh, 760px);
      border-radius: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 70px rgba(0,0,0,0.5);
    }
  }
  .chat-header {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 11px;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top));
    background: rgba(20,24,33,0.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 16px rgba(0,0,0,0.22);
  }
  .chat-header img { height: 26px; border-radius: 6px; }
  .chat-header-info { display: flex; flex-direction: column; min-width: 0; }
  .chat-header-title { font-family: var(--font-head); font-weight: 700; font-size: 14px; }
  .chat-header-sub { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
    margin-left: auto; flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(52,211,153,0.18);
  }
  .chat-status-dot.closed { background: var(--warn); box-shadow: 0 0 0 3px rgba(248,113,113,0.18); }

  .chat-messages {
    position: relative; z-index: 1;
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  @keyframes chatBubbleIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .chat-bubble {
    max-width: min(83%, 300px);
    padding: 9px 13px 10px;
    border-radius: 17px;
    font-size: 15px;
    line-height: 1.45;
    word-wrap: break-word;
    white-space: pre-wrap;
    animation: chatBubbleIn 0.2s ease;
  }
  .chat-bubble::after { content: ""; display: table; clear: both; }
  .chat-bubble-time {
    float: right;
    margin: 4px 0 -3px 10px;
    font-size: 10.5px;
    opacity: 0.6;
    white-space: nowrap;
  }
  .chat-bubble.customer {
    align-self: flex-end;
    background: var(--accent-grad);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 10px rgba(124,92,252,0.25);
  }
  .chat-bubble.staff {
    align-self: flex-start;
    background: #202533;
    border: 1px solid rgba(255,255,255,0.06);
    color: var(--text);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }

  /* Strukturierte Begrüßungs-/Reservierungsnachricht statt eines großen Textblocks */
  .bubble-greeting { max-width: min(85%, 310px); padding: 12px 14px 11px; }
  .greeting-hello { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .greeting-sub { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
  .greeting-items { display: flex; flex-direction: column; gap: 5px; margin-bottom: 9px; }
  .greeting-item {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 7px 10px; background: rgba(255,255,255,0.045); border-radius: 10px;
  }
  .greeting-product { font-size: 13.5px; }
  .greeting-price { font-weight: 700; font-size: 13.5px; color: #c9b6ff; flex-shrink: 0; white-space: nowrap; }
  .greeting-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; color: var(--ok);
    background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.3);
    padding: 4px 10px; border-radius: 20px;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }

  /* Kompakte Erfolgs-Nachricht (z.B. "Chat wurde freigeschaltet") mit kleinem Badge statt Emoji */
  .bubble-success {
    display: flex; align-items: flex-start; gap: 8px;
    background: rgba(52,211,153,0.1);
    border: 1px solid rgba(52,211,153,0.28);
  }
  .success-icon {
    width: 18px; height: 18px; border-radius: 50%; background: var(--ok); color: #06281c;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
  }
  .success-body { flex: 1; }
  .chat-empty { margin: auto; text-align: center; color: var(--muted); font-size: 13px; padding: 0 20px; }

  .chat-input-bar {
    position: relative; z-index: 1;
    display: flex; gap: 8px; align-items: flex-end;
    padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: rgba(17,20,28,0.94);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
  }
  .chat-input-bar textarea {
    flex: 1;
    resize: none;
    max-height: 100px;
    min-height: 22px;
    padding: 10px 16px;
    border-radius: 22px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14.5px;
    line-height: 1.4;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .chat-input-bar textarea::placeholder { color: var(--muted); }
  .chat-input-bar textarea:focus { outline: none; border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(124,92,252,0.15); }
  .chat-send-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent-grad);
    border: none; color: #fff; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(124,92,252,0.35);
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }
  .chat-send-btn:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 4px 14px rgba(124,92,252,0.45); }
  .chat-send-btn:active:not(:disabled) { transform: scale(0.96); }
  .chat-send-btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
  .chat-send-btn svg { transform: translateX(1px); }

  .chat-closed-banner {
    position: relative; z-index: 1;
    text-align: center; font-size: 12.5px; color: var(--muted);
    padding: 10px; background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .chat-close-link {
    position: relative; z-index: 1;
    color: var(--muted); background: var(--surface-2); border: 1px solid var(--border);
    font-size: 11.5px; cursor: pointer; padding: 6px 16px; border-radius: 20px;
    display: block; width: fit-content;
  }
  .chat-close-link:hover { color: var(--warn); border-color: var(--warn); }

  .chat-verify-bar {
    position: relative; z-index: 1;
    padding: 16px 18px;
    background: rgba(124,92,252,0.08);
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .chat-verify-bar p { margin: 0 0 10px 0; font-size: 13px; color: var(--text); }
  .chat-verify-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .chat-verify-row input {
    flex: 1 1 160px; max-width: 200px; min-width: 0;
    text-align: center; letter-spacing: 4px; font-size: 16px;
    padding: 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
  }
  .chat-verify-row input::placeholder { letter-spacing: normal; font-size: 12.5px; color: var(--muted); }
  #chat-verify-bar .error-text {
    display: inline-flex; align-items: center; gap: 6px;
    margin: 10px auto 0; padding: 7px 14px 7px 12px;
    background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
    border-radius: 10px; font-size: 12px; font-weight: 500; color: var(--warn);
    min-height: 0; max-width: 90%; text-align: left;
  }
  #chat-verify-bar .error-text:empty { display: none; margin: 0; padding: 0; border: none; background: none; }
  #chat-verify-bar .error-text::before { content: "⚠"; flex-shrink: 0; }
  .chat-verify-btn {
    flex: 0 0 auto;
    padding: 10px 18px; border-radius: 10px; border: none;
    background: var(--accent-grad); color: #fff; font-weight: 600; cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .chat-verify-btn:hover:not(:disabled) { transform: translateY(-1px); }
  .chat-verify-btn:disabled { opacity: 0.6; cursor: default; }

  .chat-answer-btn {
    display: block; margin-top: 8px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
    color: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
  }
  .chat-bubble.staff .chat-answer-btn { background: var(--accent-grad); border: none; color: #fff; }

  /* Groß & mittig angezeigter Verifizierungscode zum Antippen/Kopieren */
  .chat-code-card {
    align-self: center;
    width: min(84%, 260px);
    margin: 6px auto;
    padding: 16px 16px 12px;
    border-radius: 18px;
    text-align: center;
    background: var(--surface-2);
    border: 1px solid rgba(124,92,252,0.4);
    box-shadow: 0 6px 24px rgba(124,92,252,0.18);
    cursor: pointer;
    user-select: none;
    animation: chatBubbleIn 0.25s ease;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .chat-code-card:active { background: var(--surface); }
  .chat-code-card.copied { border-color: var(--ok); }
  .chat-code-label { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  .chat-code-value {
    font-family: var(--font-head);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 5px;
    background: var(--accent-grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.2;
    word-break: break-all;
  }
  .chat-code-hint { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .chat-code-card.copied .chat-code-hint { color: var(--ok); font-weight: 600; }
  .chat-code-card .chat-bubble-meta { opacity: 0.55; margin-top: 8px; text-align: center; }

  .chat-popup-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .chat-popup {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; width: 100%; max-width: 340px;
  }
  .chat-popup h3 { margin: 0 0 16px 0; font-family: var(--font-head); font-size: 16px; }
  .chat-popup label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
  .chat-popup input {
    display: block; width: 100%; margin-top: 6px; padding: 9px 12px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px;
  }
  .chat-popup-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .chat-popup-actions button { width: auto; }

  .chat-loading, .chat-error {
    height: 100dvh; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 24px;
  }
</style>
</head>
<body>

  <div id="chat-loading" class="chat-loading">Chat wird geladen…</div>

  <div id="chat-page" class="chat-page hidden">
    <div class="aurora-bg"><span></span><span></span><span></span></div>
    <div class="chat-header">
      <img src="assets/logo-wide.jpg" alt="LuxeFinds" />
      <div class="chat-header-info">
        <span class="chat-header-title">Live-Chat</span>
        <span class="chat-header-sub" id="chat-header-sub"></span>
      </div>
      <div class="chat-status-dot" id="chat-status-dot"></div>
    </div>

    <div class="chat-messages" id="chat-messages"></div>

    <div class="chat-closed-banner hidden" id="chat-closed-banner">Dieser Chat wurde beendet.</div>

    <div class="chat-verify-bar hidden" id="chat-verify-bar">
      <p>🔒 Bitte gib den Verifizierungscode ein, den du von uns erhalten hast, um zu schreiben.</p>
      <div class="chat-verify-row">
        <input type="text" id="verify-code-input" placeholder="6-stelliger Code" maxlength="6" inputmode="numeric" />
        <button id="verify-submit-btn" class="chat-verify-btn">Bestätigen</button>
      </div>
      <p id="verify-error" class="error-text"></p>
    </div>

    <div class="chat-input-bar hidden" id="chat-input-bar">
      <textarea id="chat-input" rows="1" placeholder="Nachricht schreiben…"></textarea>
      <button id="chat-send-btn" class="chat-send-btn" aria-label="Senden">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 11.5L20.5 3.5L14.5 20.5L11 13L3 11.5Z" fill="currentColor"/><path d="M11 13L20.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <button id="chat-end-btn" class="chat-close-link" style="margin: 8px auto 12px;">Chat beenden</button>
  </div>

  <div id="chat-error" class="chat-error hidden">Dieser Chat-Link ist ungültig oder wurde nicht gefunden.</div>

  <script src="js/chat.js"></script>
</body>
</html>
