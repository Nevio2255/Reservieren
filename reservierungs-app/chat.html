<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>LuxeFinds · Live-Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  html, body { height: 100%; margin: 0; }
  .chat-page {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }
  .chat-header {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    background: rgba(20,24,33,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .chat-header img { height: 26px; }
  .chat-header-info { display: flex; flex-direction: column; }
  .chat-header-title { font-family: var(--font-head); font-weight: 700; font-size: 14px; }
  .chat-header-sub { font-size: 11px; color: var(--muted); }
  .chat-status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-left: auto; flex-shrink: 0; }
  .chat-status-dot.closed { background: var(--warn); }

  .chat-messages {
    position: relative; z-index: 1;
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .chat-bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .chat-bubble-meta { font-size: 10.5px; opacity: 0.65; margin-top: 4px; }
  .chat-bubble.customer {
    align-self: flex-end;
    background: var(--accent-grad);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .chat-bubble.staff {
    align-self: flex-start;
    background: var(--surface-2);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .chat-empty { margin: auto; text-align: center; color: var(--muted); font-size: 13px; padding: 0 20px; }

  .chat-input-bar {
    position: relative; z-index: 1;
    display: flex; gap: 10px; align-items: flex-end;
    padding: 12px 14px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: rgba(20,24,33,0.9);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
  }
  .chat-input-bar textarea {
    flex: 1;
    resize: none;
    max-height: 100px;
    padding: 11px 14px;
    border-radius: 20px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
  }
  .chat-send-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--accent-grad);
    border: none; color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .chat-send-btn:disabled { opacity: 0.5; cursor: default; }

  .chat-closed-banner {
    position: relative; z-index: 1;
    text-align: center; font-size: 12.5px; color: var(--muted);
    padding: 10px; background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .chat-close-link { color: var(--warn); background: none; border: none; font-size: 12px; cursor: pointer; text-decoration: underline; }

  .chat-loading, .chat-error {
    height: 100dvh; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 24px;
  }
</style>
</head>
<body>

  <div id="chat-loading" class="chat-loading">Chat wird geladen…</div>

  <div id="chat-page" class="chat-page hidden">
    <div class="aurora-bg"><span></span><span></span><span></span></div>
    <div class="chat-header">
      <img src="assets/logo-wide.jpg" alt="LuxeFinds" />
      <div class="chat-header-info">
        <span class="chat-header-title">Live-Chat</span>
        <span class="chat-header-sub" id="chat-header-sub"></span>
      </div>
      <div class="chat-status-dot" id="chat-status-dot"></div>
    </div>

    <div class="chat-messages" id="chat-messages"></div>

    <div class="chat-closed-banner hidden" id="chat-closed-banner">Dieser Chat wurde beendet.</div>
    <div class="chat-input-bar" id="chat-input-bar">
      <textarea id="chat-input" rows="1" placeholder="Nachricht schreiben…"></textarea>
      <button id="chat-send-btn" class="chat-send-btn">➤</button>
    </div>
    <button id="chat-end-btn" class="chat-close-link" style="margin: 8px auto 12px;">Chat beenden</button>
  </div>

  <div id="chat-error" class="chat-error hidden">Dieser Chat-Link ist ungültig oder wurde nicht gefunden.</div>

  <script src="js/chat.js"></script>
</body>
</html>
